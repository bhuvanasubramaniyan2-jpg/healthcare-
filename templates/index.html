<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #f5faff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 700px;
            max-width: 92%;
            height: 650px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .header p {
            margin: 0;
            font-size: 15px;
        }

        .chat-box {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            background: #f8fbff;
        }

        .message {
            padding: 13px 17px;
            margin-bottom: 15px;
            border-radius: 15px;
            max-width: 75%;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .bot {
            background: #e3f2fd;
            color: #222;
            margin-right: auto;
        }

        .user {
            background: #1976d2;
            color: white;
            margin-left: auto;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 18px;
            background: white;
            border-top: 1px solid #ddd;
        }

        .input-area input {
            flex: 1;
            padding: 15px;
            border: 1px solid #bbb;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        .input-area input:focus {
            border-color: #1976d2;
        }

        .input-area button {
            padding: 15px 25px;
            border: none;
            border-radius: 12px;
            background: #1976d2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .input-area button:hover {
            background: #1565c0;
        }

        @media (max-width: 600px) {
            .chat-container {
                height: 90vh;
                width: 95%;
            }

            .message {
                max-width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <div class="header">
            <h1>🏥 Healthcare Chatbot</h1>
            <p>General Healthcare Information Assistant</p>
        </div>

        <div id="chat-box" class="chat-box">
            <div class="message bot">
                Hello! 👋 I am your Healthcare Chatbot. How can I help you?
            </div>
        </div>

        <form id="chat-form" class="input-area">
            <input
                type="text"
                id="message"
                placeholder="Type your healthcare question..."
                autocomplete="off"
                required
            >

            <button type="submit">Send</button>
        </form>

    </div>

    <script>
        const form = document.getElementById("chat-form");
        const input = document.getElementById("message");
        const chatBox = document.getElementById("chat-box");

        function addMessage(text, type) {
            const div = document.createElement("div");
            div.className = "message " + type;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const message = input.value.trim();

            if (!message) {
                return;
            }

            addMessage("You: " + message, "user");

            input.value = "";

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: message
                    })
                });

                const data = await response.json();

                addMessage("Bot: " + data.reply, "bot");

            } catch (error) {
                addMessage(
                    "Bot: Sorry, something went wrong. Please try again.",
                    "bot"
                );
            }
        });
    </script>

</body>
</html>
